name: ExtDN M2 PHPStan
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  # PHPStan 8.1/8.2 images are broken upstream (containers exit silently).
  # See: https://github.com/extdn/github-actions-m2/issues/159
  php83:
    name: M2 PHPStan (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: extdn/github-actions-m2/magento-phpstan/8.3@master
        with:
          composer_name: krombox/module-downloadable-links-sync
          phpstan_level: '1'

  php84:
    name: M2 PHPStan (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: extdn/github-actions-m2/magento-phpstan/8.4@master
        with:
          composer_name: krombox/module-downloadable-links-sync
          phpstan_level: '1'

  php85:
    name: M2 PHPStan (PHP 8.5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: extdn/github-actions-m2/magento-phpstan/8.5@master
        with:
          composer_name: krombox/module-downloadable-links-sync
          phpstan_level: '1'
