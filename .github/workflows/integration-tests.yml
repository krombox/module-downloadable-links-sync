name: Integration Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  php81:
    name: Integration Tests (PHP 8.1, Magento 2.4.6)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        options: --tmpfs /var/lib/mysql:rw --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10
      es:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: --health-cmd="curl -sf http://localhost:9200/_cluster/health" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MODULE_NAME: Krombox_DownloadableLinksSync
      COMPOSER_NAME: krombox/module-downloadable-links-sync
      BLOCK_INSECURE: 'false'
      ELASTICSEARCH: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: extdn/github-actions-m2/magento-integration-tests/8.1@master
        env:
          MAGENTO_VERSION: '2.4.6-p15'

  php83:
    name: Integration Tests (PHP 8.3, Magento 2.4.7)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        options: --tmpfs /var/lib/mysql:rw --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10
      es:
