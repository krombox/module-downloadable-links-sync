name: ExtDN M2 Coding Standard
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  php81:
    name: M2 Coding Standard (PHP 8.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: extdn/github-actions-m2/magento-coding-standard/8.1@master

  php85:
    name: M2 Coding Standard (PHP 8.5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: extdn/github-actions-m2/magento-coding-standard/8.5@master
